server.port=8080

# ---- Database: H2 in memory (data is lost when the app stops) ----
spring.datasource.url=jdbc:h2:mem:eventsdb
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

# ---- To use MySQL instead: add the mysql-connector-j dependency to pom.xml, then use these ----
# spring.datasource.url=jdbc:mysql://localhost:3306/eventsdb
# spring.datasource.username=root
# spring.datasource.password=your_password
# spring.jpa.hibernate.ddl-auto=update

# ---- Picture uploads ----
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
